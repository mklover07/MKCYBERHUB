<!DOCTYPE html>
<html>
<head>
    <title>Real-time AI Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 15px 20px;
            width: 100%;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #00d4ff;
        }
        .header span {
            color: #ffd700;
        }
        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #00d4ff33;
            aspect-ratio: 16/9;
            max-height: 480px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-start {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }
        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00d4ff66;
        }
        .btn-stop {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }
        .btn-stop:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ff444466;
        }
        .btn-capture {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #000;
        }
        .btn-capture:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ffd70066;
        }
        .status-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
            border: 1px solid #333;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.red { background: #ff4444; }
        .status-dot.green { background: #44ff88; animation: pulse 1.5s infinite; }
        .status-dot.yellow { background: #ffaa00; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .detection-info {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
            border: 1px solid #333;
        }
        .detection-info .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .detection-info .value {
            font-size: 28px;
            font-weight: 800;
            margin: 4px 0;
            color: #00d4ff;
        }
        .detection-info .confidence {
            font-size: 18px;
            color: #ffd700;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.1s;
            background: linear-gradient(90deg, #ff4444, #ffaa00, #44ff88);
        }
        .result-box {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
            border: 1px solid #333;
            display: none;
        }
        .result-box.show { display: block; }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .result-item {
            padding: 8px 12px;
            background: #0a0a0a;
            border-radius: 8px;
        }
        .result-item .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        .result-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-top: 2px;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 18px; }
            .btn { padding: 10px 18px; font-size: 13px; }
            .result-grid { grid-template-columns: 1fr; }
            .status-box { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ <span>REAL-TIME</span> AI SCANNER</h1>
        <p style="margin:4px 0 0;font-size:13px;color:#aaa;">🔴 LIVE DEMO — Point camera at any object</p>
    </div>

    <div class="container">
        
        <!-- Video -->
        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-start" onclick="startScanner()">▶ START AI</button>
            <button class="btn btn-stop" onclick="stopScanner()">⏹ STOP</button>
            <button class="btn btn-capture" onclick="captureFrame()">📸 CAPTURE</button>
        </div>

        <!-- Status -->
        <div class="status-box">
            <div class="status-item">
                <span class="status-dot red" id="statusDot"></span>
                <span id="statusText">⏳ READY</span>
            </div>
            <div class="status-item">
                <span>📊 FPS: <strong id="fpsDisplay">--</strong></span>
            </div>
            <div class="status-item">
                <span>🎯 Objects: <strong id="objCount">0</strong></span>
            </div>
            <div class="status-item">
                <span>🧠 Model: <strong id="modelStatus">Loading...</strong></span>
            </div>
        </div>

        <!-- Detection Info -->
        <div class="detection-info">
            <div class="label">🔍 DETECTED OBJECT</div>
            <div class="value" id="detectedObject">--</div>
            <div class="confidence" id="confidenceDisplay">CONFIDENCE: --%</div>
            <div class="progress-bar">
                <div class="progress-fill" id="confidenceBar" style="width:0%"></div>
            </div>
            <div style="margin-top:8px;font-size:13px;color:#888;" id="debugInfo">📷 Ready for detection...</div>
        </div>

        <!-- Result Box -->
        <div class="result-box" id="resultBox">
            <h3 style="margin:0 0 12px 0;color:#ffd700;">📸 SCAN RESULT</h3>
            <div class="result-grid">
                <div class="result-item">
                    <div class="label">OBJECT</div>
                    <div class="value" id="rObject">--</div>
                </div>
                <div class="result-item">
                    <div class="label">CONFIDENCE</div>
                    <div class="value" id="rConfidence">--%</div>
                </div>
                <div class="result-item">
                    <div class="label">CATEGORY</div>
                    <div class="value" id="rCategory">--</div>
                </div>
                <div class="result-item">
                    <div class="label">DESCRIPTION</div>
                    <div class="value" id="rDescription">--</div>
                </div>
            </div>
        </div>

    </div>

    <!-- TensorFlow Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>

    <script>
        // ================================================================
        // 🔥 REAL-TIME AI SCANNER - LIVE DEMO
        // ================================================================

        let model = null;
        let stream = null;
        let isRunning = false;
        let detectionInterval = null;
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let detectedObject = '--';
        let confidence = 0;

        // ================================================================
        // 🚀 LOAD AI MODEL
        // ================================================================

        async function loadModel() {
            document.getElementById('modelStatus').textContent = 'Loading COCO-SSD...';
            document.getElementById('debugInfo').textContent = '⏳ Loading AI Model...';
            
            try {
                model = await cocoSsd.load();
                document.getElementById('modelStatus').textContent = '✅ COCO-SSD Ready';
                document.getElementById('debugInfo').textContent = '✅ Model loaded! Click START';
                document.getElementById('statusDot').className = 'status-dot yellow';
                document.getElementById('statusText').textContent = '✅ MODEL READY';
                console.log('✅ COCO-SSD Model Loaded Successfully!');
            } catch (e) {
                document.getElementById('modelStatus').textContent = '❌ Failed to load';
                document.getElementById('debugInfo').textContent = '❌ Error: ' + e.message;
                console.error('❌ Model Load Error:', e);
            }
        }

        // ================================================================
        // 📷 START CAMERA & DETECTION
        // ================================================================

        async function startScanner() {
            if (isRunning) {
                document.getElementById('debugInfo').textContent = '⚠️ Already running!';
                return;
            }

            try {
                // Check Model
                if (!model) {
                    document.getElementById('debugInfo').textContent = '⏳ Loading model first...';
                    await loadModel();
                    if (!model) return;
                }

                // Start Camera
                document.getElementById('statusText').textContent = '📷 Starting camera...';
                document.getElementById('debugInfo').textContent = '📷 Requesting camera permission...';

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                // Canvas size
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // Start Detection
                isRunning = true;
                document.getElementById('statusDot').className = 'status-dot green';
                document.getElementById('statusText').textContent = '🟢 LIVE SCANNING';
                document.getElementById('debugInfo').textContent = '✅ Scanning... Point camera at objects!';

                startDetectionLoop();

            } catch (e) {
                document.getElementById('statusText').textContent = '❌ ERROR';
                document.getElementById('debugInfo').textContent = '❌ ' + e.message;
                document.getElementById('statusDot').className = 'status-dot red';
                console.error('❌ Start Error:', e);
            }
        }

        // ================================================================
        // 🔄 DETECTION LOOP (Runs every 150ms)
        // ================================================================

        function startDetectionLoop() {
            if (detectionInterval) clearInterval(detectionInterval);

            detectionInterval = setInterval(async () => {
                if (!isRunning || !video || video.paused) return;
                if (video.videoWidth === 0 || video.videoHeight === 0) return;

                // FPS
                frameCount++;
                if (Date.now() - lastFpsTime > 1000) {
                    document.getElementById('fpsDisplay').textContent = frameCount;
                    frameCount = 0;
                    lastFpsTime = Date.now();
                }

                const w = video.videoWidth;
                const h = video.videoHeight;
                canvas.width = w;
                canvas.height = h;
                ctx.clearRect(0, 0, w, h);

                // ==== RUN DETECTION ====
                if (model) {
                    try {
                        const predictions = await model.detect(video);
                        const filtered = predictions.filter(p => p.score > 0.5);

                        // Update count
                        document.getElementById('objCount').textContent = filtered.length;

                        if (filtered.length > 0) {
                            // Draw boxes
                            filtered.forEach(p => {
                                // Box
                                ctx.strokeStyle = '#00d4ff';
                                ctx.lineWidth = 2;
                                ctx.strokeRect(p.bbox[0], p.bbox[1], p.bbox[2], p.bbox[3]);

                                // Label background
                                const label = p.class.toUpperCase() + ' (' + Math.round(p.score * 100) + '%)';
                                ctx.font = 'bold 14px Arial';
                                const metrics = ctx.measureText(label);
                                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                                ctx.fillRect(p.bbox[0] - 2, p.bbox[1] - 24, metrics.width + 16, 24);

                                // Label text
                                ctx.fillStyle = '#00d4ff';
                                ctx.fillText(label, p.bbox[0] + 4, p.bbox[1] - 6);
                            });

                            // Update UI with top detection
                            const top = filtered[0];
                            detectedObject = top.class.toUpperCase();
                            confidence = Math.round(top.score * 100);

                            document.getElementById('detectedObject').textContent = detectedObject;
                            document.getElementById('confidenceDisplay').textContent = 'CONFIDENCE: ' + confidence + '%';
                            document.getElementById('confidenceBar').style.width = confidence + '%';
                            document.getElementById('debugInfo').textContent = 
                                '🎯 ' + detectedObject + ' (' + confidence + '%) | ' + filtered.length + ' objects';

                            // Change color based on confidence
                            const bar = document.getElementById('confidenceBar');
                            if (confidence > 70) {
                                bar.style.background = 'linear-gradient(90deg, #44ff88, #00dd66)';
                            } else if (confidence > 50) {
                                bar.style.background = 'linear-gradient(90deg, #ffaa00, #ff8800)';
                            } else {
                                bar.style.background = 'linear-gradient(90deg, #ff4444, #cc0000)';
                            }

                            // Update Threat level
                            if (detectedObject === 'PERSON') {
                                document.getElementById('statusText').textContent = '🟡 PERSON DETECTED';
                            } else {
                                document.getElementById('statusText').textContent = '🟢 ' + detectedObject + ' DETECTED';
                            }

                        } else {
                            // No objects
                            document.getElementById('detectedObject').textContent = '🔍 NO OBJECT';
                            document.getElementById('confidenceDisplay').textContent = 'CONFIDENCE: --%';
                            document.getElementById('confidenceBar').style.width = '0%';
                            document.getElementById('debugInfo').textContent = '🔍 Searching for objects...';
                            document.getElementById('objCount').textContent = '0';
                            document.getElementById('statusText').textContent = '🟢 SCANNING...';
                        }

                    } catch (e) {
                        console.error('Detection error:', e);
                        document.getElementById('debugInfo').textContent = '❌ Detection error';
                    }
                } else {
                    document.getElementById('debugInfo').textContent = '⏳ Model not loaded yet...';
                }

            }, 150);
        }

        // ================================================================
        // 🛑 STOP SCANNER
        // ================================================================

        function stopScanner() {
            isRunning = false;
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            if (video) {
                video.srcObject = null;
                video.pause();
            }
            document.getElementById('statusDot').className = 'status-dot red';
            document.getElementById('statusText').textContent = '⏹ STOPPED';
            document.getElementById('debugInfo').textContent = '⏹ Scanner stopped';
            document.getElementById('detectedObject').textContent = '--';
            document.getElementById('confidenceDisplay').textContent = 'CONFIDENCE: --%';
            document.getElementById('confidenceBar').style.width = '0%';
            document.getElementById('objCount').textContent = '0';
            document.getElementById('fpsDisplay').textContent = '--';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // ================================================================
        // 📸 CAPTURE FRAME
        // ================================================================

        async function captureFrame() {
            if (!isRunning) {
                document.getElementById('debugInfo').textContent = '⚠️ Start scanner first!';
                return;
            }

            const imgData = canvas.toDataURL('image/jpeg');
            document.getElementById('resultBox').classList.add('show');

            // Show current detection
            document.getElementById('rObject').textContent = detectedObject || '--';
            document.getElementById('rConfidence').textContent = confidence + '%' || '--%';
            
            // Get object info from database
            const info = getObjectInfo(detectedObject);
            document.getElementById('rCategory').textContent = info.category;
            document.getElementById('rDescription').textContent = info.description;

            document.getElementById('debugInfo').textContent = '📸 Captured! Object: ' + detectedObject;

            // Also show on the result image
            const resultImg = document.createElement('img');
            resultImg.src = imgData;
            resultImg.style.width = '100%';
            resultImg.style.borderRadius = '8px';
            resultImg.style.marginTop = '8px';
            
            // Check if image already exists
            const existingImg = document.getElementById('capturedImg');
            if (existingImg) {
                existingImg.src = imgData;
            } else {
                resultImg.id = 'capturedImg';
                document.querySelector('.result-grid').after(resultImg);
            }

            // Search buttons
            if (!document.getElementById('searchBtns')) {
                const searchDiv = document.createElement('div');
                searchDiv.id = 'searchBtns';
                searchDiv.style.cssText = 'margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;';
                searchDiv.innerHTML = `
                    <button onclick="searchGoogle()" style="padding:6px 16px;background:#4285f4;color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:600;">🔍 Google</button>
                    <button onclick="searchYouTube()" style="padding:6px 16px;background:#ff0000;color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:600;">▶ YouTube</button>
                    <button onclick="searchWikipedia()" style="padding:6px 16px;background:#000;color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:600;">📖 Wikipedia</button>
                `;
                document.querySelector('.result-grid').after(searchDiv);
            }
        }

        // ================================================================
        // 📚 OBJECT DATABASE
        // ================================================================

        function getObjectInfo(name) {
            const db = {
                'PERSON': { category: 'HUMAN', description: 'A human being - most intelligent species on Earth!' },
                'DOG': { category: 'ANIMAL', description: 'Loyal domesticated carnivore - 100,000x better smell!' },
                'CAT': { category: 'ANIMAL', description: 'Small carnivorous pet - can rotate ears 180°!' },
                'CAR': { category: 'VEHICLE', description: 'Four-wheeled motor vehicle - invented in 1886!' },
                'LAPTOP': { category: 'ELECTRONICS', description: 'Portable computer - first laptop was Osborne 1 in 1981!' },
                'CELL PHONE': { category: 'ELECTRONICS', description: 'Communication device - first mobile phone in 1973!' },
                'CHAIR': { category: 'FURNITURE', description: 'Seat with backrest - used in Ancient Egypt!' },
                'TABLE': { category: 'FURNITURE', description: 'Flat-topped furniture - dates back to Ancient Egypt!' },
                'BOOK': { category: 'MEDIA', description: 'Collection of written pages - oldest printed book from 868 AD!' },
                'BOTTLE': { category: 'CONTAINER', description: 'Container for liquids - first glass bottles in Ancient Egypt!' },
                'PIZZA': { category: 'FOOD', description: 'Flat bread with toppings - first pizzeria opened in 1830!' },
                'APPLE': { category: 'FRUIT', description: 'Sweet edible fruit - over 7,500 varieties!' },
                'BANANA': { category: 'FRUIT', description: 'Yellow tropical fruit - contains potassium!' },
                'CUP': { category: 'KITCHEN', description: 'Container for drinking - used since ancient times!' },
                'BED': { category: 'FURNITURE', description: 'Place to sleep - humans spend 1/3 life in bed!' },
                'TV': { category: 'ELECTRONICS', description: 'Television - first electronic TV in 1927!' },
                'MOUSE': { category: 'ELECTRONICS', description: 'Computer pointing device - invented in 1963!' },
                'KEYBOARD': { category: 'ELECTRONICS', description: 'Input device - QWERTY layout since 1873!' },
                'SOFA': { category: 'FURNITURE', description: 'Comfortable seating - word comes from Arabic "suffah"!' },
                'TOILET': { category: 'PLUMBING', description: 'Sanitary fixture - modern flush toilet invented in 1596!' }
            };
            
            // Try exact match first
            if (db[name]) return db[name];
            
            // Try partial match
            for (const [key, value] of Object.entries(db)) {
                if (name && name.includes(key)) return value;
            }
            
            return { category: 'UNKNOWN', description: 'A ' + name + ' detected by AI!' };
        }

        // ================================================================
        // 🌐 SEARCH FUNCTIONS
        // ================================================================

        function searchGoogle() {
            const obj = document.getElementById('rObject').textContent;
            if (obj && obj !== '--') {
                window.open('https://www.google.com/search?q=' + encodeURIComponent(obj), '_blank');
            }
        }

        function searchYouTube() {
            const obj = document.getElementById('rObject').textContent;
            if (obj && obj !== '--') {
                window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(obj), '_blank');
            }
        }

        function searchWikipedia() {
            const obj = document.getElementById('rObject').textContent;
            if (obj && obj !== '--') {
                window.open('https://en.wikipedia.org/wiki/' + encodeURIComponent(obj), '_blank');
            }
        }

        // ================================================================
        // 🚀 AUTO START ON PAGE LOAD
        // ================================================================

        window.onload = function() {
            // Load model automatically
            loadModel();
            
            // Auto-start camera after model loads
            setTimeout(() => {
                if (model) {
                    startScanner();
                } else {
                    document.getElementById('debugInfo').textContent = '⏳ Waiting for model to load... Click START AI';
                }
            }, 2000);
        };

        console.log('%c⚡ REAL-TIME AI SCANNER', 'font-size:24px;color:#00d4ff;font-weight:900');
        console.log('%c🔴 LIVE DEMO - Point camera at any object!', 'font-size:14px;color:#ffd700');
        console.log('%c📷 80+ Objects supported!', 'font-size:12px;color:#888');
    </script>
</body>
</html>
